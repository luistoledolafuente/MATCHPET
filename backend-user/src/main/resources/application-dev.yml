spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_matchpet
    username: root
    password: ${DB_PASSWORD}   # <- protegido

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  # Configuración de correo electrónico
  mail:
    host: smtp.gmail.com
    port: 587
    username: luis.tlf.2006@gmail.com
    password: ${MAIL_PASSWORD}     # <- protegido
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: true

  # Configuración de seguridad OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}      # <- protegido
            client-secret: ${GOOGLE_CLIENT_SECRET}   # <- protegido
            scope: openid, email, profile

google:
  api:
    key: ${GOOGLE_API_KEY}     # <- ya estaba protegido

gemini:
  model:
    name: gemini-1.5-flash-001

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}      # <- protegido
    expiration: 43200000
  refresh:
    secret: ${JWT_REFRESH_SECRET}     # <- protegido
    expiration: 2592000000

# Configuración de MercadoPago en desarrollo
mercadopago:
  access:
    token: ${MERCADOPAGO_ACCESS_TOKEN}  # <- protegido

# Configuración del frontend
frontend:
  url: http://localhost:5173
